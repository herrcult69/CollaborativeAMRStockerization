# Shared costmap settings. Load robot_<profile>.yaml afterward.
transform_tolerance: 0.3
resolution: 0.05
always_send_full_costmap: true

static_layer:
  map_topic: /map
  subscribe_to_updates: false
  track_unknown_space: true

obstacle_layer:
  observation_sources: laser
  combination_method: 1
  laser:
    topic: /scan
    data_type: LaserScan
    marking: true
    clearing: true
    inf_is_valid: true
    # Positive infinity is converted near 10 m for clearing. Do not mark it.
    obstacle_range: 9.0
    raytrace_range: 10.0
    min_obstacle_height: 0.05
    max_obstacle_height: 2.0
    observation_persistence: 0.0
    expected_update_rate: 0.5

inflation_layer:
  inflation_radius: 0.65
  cost_scaling_factor: 3.0
