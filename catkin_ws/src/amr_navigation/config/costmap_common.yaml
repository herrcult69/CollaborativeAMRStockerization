# # =========================================================
# # Common costmap configuration
# # Used by both global and local costmaps
# # =========================================================

# obstacle_range: 8.0
# raytrace_range: 8.0

# # IMPORTANT:
# # This should cover the actual robot body,
# # including the rear forks.
# #
# # Tune this after visualizing the robot in RViz.
# footprint: [
#   [-0.60, -0.25],
#   [-0.60,  0.25],
#   [ 0.35,  0.25],
#   [ 0.35, -0.25]
# ]

# # Safety buffer around the robot.
# inflation_radius: 0.20

# # How aggressively obstacle costs increase
# # as they get closer to the robot.
# cost_scaling_factor: 5.0

# observation_sources: laser_scan_sensor

# laser_scan_sensor:
#   sensor_frame: laser_link
#   data_type: LaserScan
#   topic: /scan

#   marking: true
#   clearing: true

#   inf_is_valid: true

# =========================================================
# COMMON COSTMAP PARAMETERS
# =========================================================

footprint: [
  [-0.60, -0.25],
  [-0.60,  0.25],
  [ 0.35,  0.25],
  [ 0.35, -0.25]
]

footprint_padding: 0.01

transform_tolerance: 0.5


# =========================================================
# OBSTACLE LAYER
# IMPORTANT:
# These parameters MUST be under obstacle_layer
# =========================================================

obstacle_layer:

  enabled: true

  obstacle_range: 8.0
  raytrace_range: 8.0

  max_obstacle_height: 2.0
  min_obstacle_height: 0.0

  combination_method: 1

  footprint_clearing_enabled: true

  observation_sources: laser_scan_sensor

  laser_scan_sensor:

    sensor_frame: laser_link

    data_type: LaserScan

    topic: /scan

    marking: true
    clearing: true

    inf_is_valid: true


# =========================================================
# INFLATION LAYER
# =========================================================

inflation_layer:

  enabled: true

  inflation_radius: 0.70 #0.2

  cost_scaling_factor: 3.0 #0.5