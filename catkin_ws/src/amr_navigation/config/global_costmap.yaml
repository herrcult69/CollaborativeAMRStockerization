global_frame: map
rolling_window: false
track_unknown_space: true
update_frequency: 2.0
publish_frequency: 1.0
plugins:
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: blocker_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
blocker_layer:
  observation_sources: blocker
  blocker: {topic: /velocity_gate/blocker, data_type: PointCloud2, marking: true, clearing: false,
            obstacle_range: 50.0, min_obstacle_height: 0.0, max_obstacle_height: 2.0,
            observation_persistence: 0.0, expected_update_rate: 0.0}
