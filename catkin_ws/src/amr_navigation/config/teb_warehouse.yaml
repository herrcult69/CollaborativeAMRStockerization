# teb_warehouse.yaml (Differential-Drive In-Place Rotation Optimized)
# Trajectory parameters
teb_autosize: true
dt_ref: 0.3
dt_hysteresis: 0.1
max_samples: 500
no_inner_iterations: 3
no_outer_iterations: 3
global_plan_overwrite_orientation: true
allow_init_with_backwards_motion: false
max_global_plan_lookahead_dist: 2.0
feasibility_check_no_poses: 4

# Velocity & Acceleration Limits (Differential Drive)
max_vel_x: 0.35
max_vel_x_backwards: 0.10          # must be > penalty_epsilon (0.05) to prevent negative bound warning
max_vel_theta: 0.45                # slower rotation, less wobble
acc_lim_x: 0.5
acc_lim_theta: 1.0                 # gentler rotational acceleration
penalty_epsilon: 0.05              # safety margin for hard velocity bounds

# Goal Tolerances
xy_goal_tolerance: 0.25
yaw_goal_tolerance: 0.20
free_goal_vel: false

# Differential Drive Kinematics (Zero-Radius Turn in Place)
min_turning_radius: 0.0              # 0.0 = differential drive, allows turning on the spot
wheelbase: 0.0                       # 0.0 for diff-drive (not Ackermann)
cmd_angle_instead_rotvel: false

# Optimization Weights: Prioritize In-Place Rotation over Curving (No Ackermann Arc)
weight_kinematics_nh: 1000.0         # non-holonomic constraint (no sideways sliding)
weight_kinematics_forward_drive: 100.0# High penalty on backward drive (v < 0); zero penalty on in-place rotation (v = 0)
weight_kinematics_turning_radius: 0.0 # no effect on diff drive (min_turning_radius 0)
weight_optimaltime: 1.0              # favors fast trajectory (rotate-in-place then straight)
weight_obstacle: 30.0
weight_inflation: 0.2

# Global via-points OFF (S3): facing a path that is behind the robot is the gate's spin-first job
# (velocity_gate spin_enter / spin_exit). Revert = sep 0.4, weight 1.0.
global_plan_viapoint_sep: -0.1
weight_viapoint: 0.0

# Disable Homotopy Class Planning: Follow global path strictly, prevent reverse looping detours
enable_homotopy_class_planning: false
enable_multithreading: false
simple_exploration: false
max_number_classes: 1

# Footprint & Obstacles
footprint_model:
  type: "polygon"
  vertices: [[0.37, 0.23], [-0.54, 0.23], [-0.54, -0.23], [0.37, -0.23]]
min_obstacle_dist: 0.15              # 0.84 m and 1.00 m gaps feasible; 0.65 m stays blocked
inflation_dist: 0.30                 # matches lower min_obstacle_dist
include_costmap_obstacles: true
include_dynamic_obstacles: false

# Disabled heavy costmap converter to eliminate 9.5Hz control loop missed deadlines
costmap_converter_plugin: ""
costmap_converter_spin_thread: false
costmap_converter_rate: 5

# Anti-oscillation
oscillation_recovery: true
switching_blocking_period: 2.0
selection_obst_cost_scale: 1.0
selection_viapoint_cost_scale: 1.0

# DIAGNOSTIC (teb-lockon Step 1): publishes ~teb_feedback. Remove after diagnosis.
publish_feedback: true
