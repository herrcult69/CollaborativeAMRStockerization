# Initial low-speed settings for the unloaded differential-drive training robot.
# Acceleration limits are planning assumptions, not measured actuator guarantees.
odom_topic: /odom
max_vel_x: 0.25
min_vel_x: 0.0
max_vel_y: 0.0
min_vel_y: 0.0
max_vel_trans: 0.25
# At rest, acc_lim_x / controller_frequency = 0.04 m/s.
# Keep an admissible initial sample; raising this alone to 0.10 rejects
# all startup samples with the current angular limits as well.
min_vel_trans: 0.03
max_vel_theta: 0.45
min_vel_theta: 0.08
acc_lim_x: 0.4
acc_lim_y: 0.0
acc_lim_trans: 0.4
acc_lim_theta: 0.6
xy_goal_tolerance: 0.20
yaw_goal_tolerance: 0.20
trans_stopped_vel: 0.02
theta_stopped_vel: 0.03
prune_plan: true
sim_time: 2.0
sim_granularity: 0.025
angular_sim_granularity: 0.05
vx_samples: 10
vy_samples: 1
vth_samples: 20
path_distance_bias: 32.0
goal_distance_bias: 20.0
occdist_scale: 0.1
forward_point_distance: 0.2
stop_time_buffer: 0.3
scaling_speed: 0.20
max_scaling_factor: 0.10
use_dwa: true
